[package]
name = "omni-embeddings"
version = "0.2.0"
edition = "2021"
authors = ["Streaming AI Team <team@omni-ai.org>"]
description = "High-Throughput Native Rust Embedding Inference Server with Continuous Ragged Batching and W-TinyLFU Moka Cache"
license = "Apache-2.0"

[[bin]]
name = "omni-embeddings"
path = "src/main.rs"

[lib]
name = "omni_embeddings"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
